[project]
name = "docsem"
version = "0.1.0"
description = "A python module that converts input documents into Standardized Representations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
# TODO: add your own details before publishing (PyPI does not require them)
# authors = [{ name = "Shashwat Suthar", email = "shashwat.suthar.comp@gmail.com" }]
keywords = ["document", "pdf", "ocr", "table-extraction", "document-intelligence", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

# Base install = lightweight cloud providers (Azure extraction, Gemini analysis).
# Heavy local-compute providers (PaddleOCR, llama.cpp) live in extras below.
dependencies = [
    "azure-ai-formrecognizer>=3.3.3",
    "azure-core>=1.41.0",
    "google-genai>=2.25.0",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
paddle = [
    "paddlepaddle>=3.3,<3.4",
    "paddleocr[doc-parser]>=3.7.0",
]
llama = [
    "llama-cpp-python>=0.3",
    "huggingface-hub>=0.24",
]
all = ["docsem[paddle,llama]"]

# TODO: fill in once the repo is public
# [project.urls]
# Homepage = "https://github.com/Shashwat-6012/docsem"
# Issues = "https://github.com/Shashwat-6012/docsem/issues"

[project.scripts]
docsem = "docsem.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "docsem"
module-root = "src"

# ---------------------------------------------------------------------------
# uv-only settings: these apply to development in THIS repo (uv sync / uv lock).
# They are NOT part of the published package, so pip users never see them.
# ---------------------------------------------------------------------------
[tool.uv.sources]
llama-cpp-python = { index = "llama-cpu" }

[[tool.uv.index]]
name = "llama-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

# Publishing target: `uv publish --index testpypi`
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle errors, pyflakes
    "I",        # import sorting
    "B",        # bugbear (likely bugs)
    "UP",       # modernize syntax
    "SIM",      # simplifications
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]   # allow `assert False` in tests; add more as needed

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false    # flip to true once the public API is annotated

# Third-party libs without type stubs
[[tool.mypy.overrides]]
module = [
    "azure.*",
    "cv2",
    "dotenv",
    "google.*",
    "llama_cpp.*",
    "numpy",
    "paddle.*",
    "paddleocr.*",
    "pypdfium2",
]
ignore_missing_imports = true